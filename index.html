<!DOCTYPE html>
<html>
<head>
<title>Sweet Lyrics Reveal</title>

<style>
body{
background:#ffe6f2;
font-family:Arial;
text-align:center;
padding-top:100px;
}

button{
padding:15px 25px;
font-size:18px;
border:none;
background:#ff4da6;
color:white;
border-radius:10px;
cursor:pointer;
}

#lyrics{
display:none;
font-size:22px;
margin-top:40px;
}
</style>

</head>

<body>

<h1>❤️ I made something for you</h1>

<p>Click the button</p>

<button onclick="start()">Start</button>

<br><br>

<audio id="song">
<source src="bg.mp3" type="audio/mpeg">
</audio>

<img id="gif" src="holding.gif" width="250" style="display:none">

<div id="lyrics"></div>

<script>

const lines = [
"Every moment with you feels special 💖",
"I don't know how you do it...",
"But you make everything brighter ✨",
"So I made this just for you 🎶"
]

function start(){

document.getElementById("song").play()

document.getElementById("gif").style.display="block"

let i=0
let box=document.getElementById("lyrics")

box.style.display="block"

setInterval(()=>{
if(i<lines.length){
box.innerHTML += lines[i] + "<br>"
i++
}
},2000)

}

</script>

</body>
</html>
